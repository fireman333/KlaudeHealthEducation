name: Deploy Astro to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm build
        env:
          NODE_ENV: production
          # v2 留言板 — set these as repo Variables (Settings → Secrets and
          # variables → Actions → Variables tab) so they're injected at
          # build time. Leaving them unset falls back to local-dev defaults
          # in src/config.ts (Turnstile always-passes test key + localhost
          # API), which keeps pages renderable even before the v2 backend
          # is deployed.
          PUBLIC_COMMENTS_API: ${{ vars.PUBLIC_COMMENTS_API }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # Astro emits files at dist/ root, but their internal links point to
      # /klaudehealthedu/*. Cloudflare Pages serves the uploaded dir at the
      # project root, so wrap dist under a klaudehealthedu/ folder — then
      # klaudehealthedu.pages.dev/klaudehealthedu/* resolves and the router
      # Worker (which forwards the pathname unchanged) finds it. Mirrors the
      # lighthouse:prep .lh-serve trick.
      - name: Prepare Pages deploy directory
        run: pnpm pages:prep

      # Direct-upload to the dedicated `klaudehealthedu` Pages project. The
      # project is served under med-study-rpg.com/klaudehealthedu via the
      # klaudehealthedu-router Worker. Requires the CLOUDFLARE_API_TOKEN repo
      # secret (Account → Cloudflare Pages → Edit). Account id is an
      # identifier, not a secret, so it is inlined.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 43631a35f33f4132484a6ce024cc502a
          command: pages deploy .cf-deploy --project-name=klaudehealthedu --branch=main
