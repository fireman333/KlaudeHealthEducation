title: 康勞德醫普
tagline: 來自台大醫學生 WLK 的繁體中文醫學科普文集
description: >-
  以 Claude Code 與 OpenEvidence 等 AI 工具為輔助，
  整理具實證基礎的繁體中文醫學科普文章。
  每篇文章標註資料來源，立場僅供參考，臨床決策仍以個別病人主治醫師判斷為準。
author: 康瑋麟（WLK）
lang: zh-Hant-TW

baseurl: ""
url: "https://fireman333.github.io"

permalink: /posts/:year-:month-:day-:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - TEMPLATE.md
  - DESIGN.md
  - CNAME.example
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
