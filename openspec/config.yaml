# OpenSpec config.yaml — generated by /spec init (2026-05-11)
# Curator-mode rules + project defaults for Klaude Health Education.
# Reference: https://github.com/Fission-AI/OpenSpec

context:
  project_md: openspec/project.md

rules:
  # === Curator philosophy ===
  - id: no-auto-commit
    rule: "Never run `git commit` automatically. All commits go through the user via the auto-git skill or explicit confirmation."
  - id: ask-on-non-trivial
    rule: "For any non-trivial decision (architecture, library choice, naming convention, scope cut), use AskUserQuestion before writing it into a proposal/spec."
  - id: phi-zero-tolerance
    rule: "Never write real patient identifiers (name / ID / chart number / DOB / address / phone) into any openspec/ file or src/content/posts/ file. If detected in user input, halt and route to /phi-deid."

  # === Workflow integrity ===
  - id: no-skip-propose
    rule: "Do not implement code changes without first running /opsx:propose for the change. The propose -> apply -> verify -> archive sequence is mandatory for any change touching openspec/specs/."
  - id: no-archive-without-verify
    rule: "Do not archive a change before /opsx:verify reports green on completeness/correctness/coherence."

  # === Project-specific retreats ===
  - id: retreat-research-plan
    rule: "If project contains research_plan.json at root, halt OpenSpec workflow and suggest /research-plan instead."
  - id: retreat-meta-analysis
    rule: "If project contains 01_protocol/ + 09_qa/ at root, halt and suggest /ma-end-to-end."

  # === Klaude Health Education specific ===
  - id: design-md-is-source-of-truth
    rule: "Visual / design decisions must respect DESIGN.md. If a proposal contradicts DESIGN.md (e.g. introduces dark mode, changes max content width, uses pill radius), flag the conflict and require user to either update DESIGN.md first or amend the proposal."
  - id: no-dark-mode
    rule: "Do not propose dark mode. Explicitly out of scope per DESIGN.md and project.md."
  - id: zod-schema-as-contract
    rule: "src/content/config.ts zod schema is the contract for post frontmatter. Any change touching post structure must propose schema migration first, not silently add optional fields."
  - id: phi-in-posts
    rule: "Articles in src/content/posts/ are public. Never include real patient identifiers, real chart data, or real images that could identify a patient."
  - id: sources-required
    rule: "Every published article must cite sources (OpenEvidence / NCCN / landmark RCT / 衛福部 / 醫學中心 衛教文宣). No sources = not ready to publish."

defaults:
  requirement_keyword: SHALL
  scenario_format: bdd
  capability_slug_case: kebab
  change_slug_pattern: "<verb>-<object>"
